# Builds the static site and publishes it to GitHub Pages on every push to main.
# Set repository variables (Settings > Secrets and variables > Actions > Variables) to move to the real domain:
#   NEXT_PUBLIC_BASE_PATH = ""                         (empty on a custom domain; "/optavius" on ppleeuw.github.io/optavius)
#   NEXT_PUBLIC_SITE_URL  = "https://www.optavius.com"
#   CUSTOM_DOMAIN         = "www.optavius.com"         (writes the CNAME file GitHub Pages needs)
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH != '' && vars.NEXT_PUBLIC_BASE_PATH || (vars.CUSTOM_DOMAIN != '' && '' || '/optavius') }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL != '' && vars.NEXT_PUBLIC_SITE_URL || (vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://ppleeuw.github.io/optavius') }}
      - if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
